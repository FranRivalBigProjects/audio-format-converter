<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
    <meta name="google-site-verification" content="PkLa_ViOo6FAHpvh8SacceMb95o9tePRdrqLNBz9X1M" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Format Converter - Convert to WAV</title>
<meta name="description" content='Convert MP3, OGG, M4A, AAC or FLAC audio to WAV directly in your browser.'>
<meta name="google-site-verification" content="REPLACE_ME">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
    :root{
      --bg:#0d0f11;--panel:#15181b;--line:#262b30;--text:#d8dee3;
      --muted:#7c8791;--accent:#5ec9a6;--accent2:#e8b34f;
    }
    *{box-sizing:border-box;}
    body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Mono',monospace;line-height:1.5;padding:32px 16px 64px;}
    .wrap{max-width:640px;margin:0 auto;}
    h1{font-size:20px;margin:0 0 6px;color:#fff;font-weight:600;}
    .desc{color:var(--muted);font-size:13px;margin:0 0 24px;}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:20px;margin-bottom:20px;}
    label{display:block;font-size:12px;color:var(--muted);margin:14px 0 6px;}
    label:first-child{margin-top:0;}
    input, select{width:100%;background:#0a0c0e;border:1px solid var(--line);color:var(--text);padding:9px 10px;border-radius:4px;font-family:inherit;font-size:14px;}
    input[type=file]{padding:8px;}
    input:focus, select:focus{outline:1px solid var(--accent);}
    button{margin-top:18px;width:100%;background:var(--accent);color:#08110d;border:none;padding:11px;border-radius:4px;font-family:inherit;font-weight:600;font-size:14px;cursor:pointer;}
    button:hover{opacity:0.9;}
    .result{margin-top:18px;padding:14px;border:1px dashed var(--line);border-radius:4px;font-size:14px;min-height:20px;}
    .result .big{font-size:16px;color:var(--accent2);font-weight:600;display:block;margin-bottom:8px;}
    .note{color:var(--muted);font-size:12px;margin-top:20px;}
    a{color:var(--accent);}
    audio{width:100%;margin-top:10px;}
    a.dl{display:inline-block;margin-top:10px;background:#1c2226;padding:8px 12px;border-radius:4px;text-decoration:none;}
  </style>
</head>
<body>
<div class="wrap">
  <h1>Audio Format Converter</h1>
  <p class="desc">Upload an audio file to convert it to WAV format.</p>
  <div class="panel">
    
    <label for="file">Audio file</label>
    <input type="file" id="file" accept="audio/*">
  
    <button onclick="run()">Convert to WAV</button>
    <div class="result" id="result"></div>
  </div>
  <p class="note">Browsers can only encode audio to WAV natively without external libraries, so output is WAV regardless of input format.</p>
</div>
<script>

function decodeFile(file, cb){
  var reader = new FileReader();
  reader.onload = function(e){
    var Ctx = window.AudioContext || window.webkitAudioContext;
    var actx = new Ctx();
    actx.decodeAudioData(e.target.result, function(buffer){ cb(buffer); }, function(){
      document.getElementById('result').innerHTML = 'Could not decode this audio file in your browser.';
    });
  };
  reader.readAsArrayBuffer(file);
}
function encodeWAV(channelData, sampleRate){
  var numChannels = channelData.length;
  var length = channelData[0].length;
  var blockAlign = numChannels*2;
  var dataSize = length*blockAlign;
  var buffer = new ArrayBuffer(44+dataSize);
  var view = new DataView(buffer);
  function writeString(offset, str){ var i; for (i=0;i<str.length;i++){ view.setUint8(offset+i, str.charCodeAt(i)); } }
  writeString(0,'RIFF'); view.setUint32(4, 36+dataSize, true); writeString(8,'WAVE');
  writeString(12,'fmt '); view.setUint32(16,16,true); view.setUint16(20,1,true);
  view.setUint16(22,numChannels,true); view.setUint32(24,sampleRate,true);
  view.setUint32(28,sampleRate*blockAlign,true); view.setUint16(32,blockAlign,true); view.setUint16(34,16,true);
  writeString(36,'data'); view.setUint32(40,dataSize,true);
  var offset = 44, i, ch, sample;
  for (i=0;i<length;i++){
    for (ch=0;ch<numChannels;ch++){
      sample = Math.max(-1, Math.min(1, channelData[ch][i]));
      view.setInt16(offset, sample<0 ? sample*0x8000 : sample*0x7FFF, true);
      offset += 2;
    }
  }
  return new Blob([view], {type:'audio/wav'});
}
function showResult(blob, label){
  var url = URL.createObjectURL(blob);
  var result = document.getElementById('result');
  result.innerHTML = '<span class="big">' + label + '</span>' +
    '<audio controls src="' + url + '"></audio>' +
    '<a class="dl" href="' + url + '" download="output.wav">Download WAV</a>';
}
function buffersFromAudioBuffer(buffer){
  var chs = [], c;
  for (c=0;c<buffer.numberOfChannels;c++){ chs.push(buffer.getChannelData(c)); }
  return chs;
}

function run(){
  var file = document.getElementById('file').files[0];
  if (!file) { document.getElementById('result').innerHTML = 'Choose an audio file.'; return; }
  decodeFile(file, function(buffer){
    var chs = buffersFromAudioBuffer(buffer);
    var blob = encodeWAV(chs, buffer.sampleRate);
    showResult(blob, 'Converted to WAV (' + buffer.sampleRate + ' Hz, ' + buffer.numberOfChannels + ' ch)');
  });
}

</script>
</body>
</html>
